# Transient Catcher - conda 环境
#
# 说明：
# - 不依赖 librosa。STFT / 重分配 / 对数重 bin 全部自己用 numpy 实现，
#   一是为了不引入额外依赖，二是为了让算法在仓库里完全可见、可移植。
# - numba 只用于轨迹关联等纯 Python 热点循环，不是必需项（没有它会慢一些）。
#
# 用法：
#   conda env create -f environment.yml
#   conda activate transient-catcher

name: transient-catcher

channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - numba>=0.59
  - soundfile>=0.12
  - pyside6>=6.6
  # mido 只用于 scripts/midi_*.py（读 MIDI 造测试集），纯 Python，不进算法。
  - mido>=1.3
